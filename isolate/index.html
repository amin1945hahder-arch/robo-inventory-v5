<body>
  <div id="root"></div>
  <script>
    // No-flash appearance bootstrap: restore THIS member's last mode before
    // React mounts (the per-user setting from the DB re-applies right after
    // sign-in). Keyed by member id, saved by use-appearance.ts.
    // NOTE: the dark class lives on <html> ONLY — a .dark class on <body>
    // would re-declare the token variables there and shadow the published
    // app theme's inline vars set on <html> (themes never applied correctly).
    (function () {
      try {
        var root = document.documentElement;
        var mode = null;
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf("rc.appearance.") === 0) {
            mode = localStorage.getItem(k);
            break;
          }
        }
        if (mode === "light") {
          root.classList.remove("dark");
          root.style.colorScheme = "light";
        } else if (mode === "system" && window.matchMedia("(prefers-color-scheme: light)").matches) {
          root.classList.remove("dark");
          root.style.colorScheme = "light";
        }
        // dark / system-dark / unset → keep the markup's default .dark class
        document.body.classList.remove("dark");
      } catch (e) {}
    })();
  </script>
</body>
